name: Deploy til GitHub Pages

# Only main. Pages deploys from the default branch anyway, and a push to the
# working branch used to cancel the main deploy that was already running,
# because both landed in the same concurrency group. The result was a green
# merge and an old app still live.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue, never cancel. Cancelling a Pages deploy halfway leaves whatever was
# there before, so a cancelled run means the newest commit silently did not
# ship.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
